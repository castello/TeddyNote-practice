[theme]
# 사용자 정의 테마가 상속받을 Streamlit 기본 테마
base = "light" # "light" 또는 "dark"

# 대화형 요소에 사용되는 기본 강조 색상
primaryColor = "#027373"

# 메인 콘텐츠 영역의 배경색
backgroundColor = "#F2E7DC"

# 사이드바와 대부분의 대화형 위젯에 사용되는 배경색
secondaryBackgroundColor = "#A9D9D0"

# 대부분의 텍스트에 사용되는 색상
textColor = "#0D0D0D"

# 코드 블록을 제외한 앱의 모든 텍스트에 사용되는 글꼴 패밀리
# "sans serif", "serif", 또는 "monospace" 중 하나를 선택가능
font = "monospace"
